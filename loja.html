<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <loja>Document</loja>
</head>
<body>
  <h1>calculadora de loja</h1> 
  <button onclick="calcularcompra()">calcular compra</button> 
  <button>calcular desconto</button> 
  <p id="resultado"> </p>
  <script>
    let total=0

    function calcularcompra(){
        let produto = prompt("digite o nome do produto")
          let preco = prompt("digite o preco do produto")
            let quantidade= prompt("digite o quantidade do produto")

            total = preco*quantidade;

            document.getElementById("resultado").innerHTML = 
            "produto:" + produto + "<br>"+
             "unitario"+preco+ "<br>"+
             "quantidade"+quantidade+ "<br>"+
             "total de compra: r$"+total
    }
  </script>
</body>
</html>
